name: Build and test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore DuplicateFinder.slnx
      - name: Build solution
        run: dotnet build DuplicateFinder.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test DuplicateFinder.slnx --configuration Release --no-build --no-restore
