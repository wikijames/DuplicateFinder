name: Build and test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore DuplicateFinder.slnx -p:Configuration=Release --locked-mode
      - name: Build solution
        run: dotnet build DuplicateFinder.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test DuplicateFinder.slnx --configuration Release --no-build --no-restore
      - name: Validate synthetic benchmark workloads
        shell: pwsh
        run: |
          # Cancellation timing is measured locally; deterministic cancellation tests run above.
          foreach ($scenario in @('small-duplicates', 'mostly-unique', 'large-duplicates')) {
            dotnet tools/DuplicateFinder.Benchmarks/bin/Release/net10.0/DuplicateFinder.Benchmarks.dll $scenario smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
