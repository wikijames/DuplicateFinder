name: Windows portable test candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked Release dependencies
        run: dotnet restore DuplicateFinder.slnx -p:Configuration=Release --locked-mode
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build DuplicateFinder.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test DuplicateFinder.slnx -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create audited portable test candidate
        id: portable
        shell: pwsh
        run: ./tools/Publish-WindowsPortable.ps1 -DotNetPath dotnet
      - name: Verify candidate without retaining a distribution artifact
        shell: pwsh
        env:
          CANDIDATE_ZIP: ${{ steps.portable.outputs.zip }}
        run: ./tools/Test-WindowsPortable.ps1 -ZipPath $env:CANDIDATE_ZIP
      # Owner policy is private testing only. Keep downloadable candidates local;
      # public artifact retention/distribution needs a separately reviewed decision.
